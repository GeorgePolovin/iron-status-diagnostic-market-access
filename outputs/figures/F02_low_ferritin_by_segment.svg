     <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="628.583438" y="390.267305" transform="rotate(-0 628.583438 390.267305)">Reference / comparison</text>
    </g>
   </g>
  </g>
  <g id="text_30">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172e3d" x="34.56" y="40.256719" transform="rotate(-0 34.56 40.256719)">F02  Depleted iron concentrates in women of reproductive age</text>
  </g>
  <g id="text_31">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #556b7a" x="34.56" y="71.387812" transform="rotate(-0 34.56 71.387812)">Menstruating, lower-income and pregnant women carry the highest prevalence; men are near 1%</text>
  </g>
  <g id="text_32">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #556b7a" transform="translate(34.56 452.267344)">Source: NHANES 2017-March 2020 pre-pandemic (CDC/NCHS), MEC exam weights. Ferritin &lt;15 ng/mL = WHO depleted iron stores.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #556b7a" transform="translate(34.56 466.967344)">Segments overlap. Pregnant n=76 (wide CI). In CKD/heart failure, ferritin &lt;15 understates deficiency (see T02 chronic-disease definition).</text>
  </g>
